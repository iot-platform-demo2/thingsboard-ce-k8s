apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: __TB_TLS_CLUSTER_ISSUER__
spec:
  acme:
    email: __TB_TLS_ACME_EMAIL__
    server: __TB_TLS_ACME_SERVER__
    privateKeySecretRef:
      name: __TB_TLS_CLUSTER_ISSUER__
    solvers:
      - http01:
          ingress:
            ingressClassName: __TB_INGRESS_CLASS_NAME__
